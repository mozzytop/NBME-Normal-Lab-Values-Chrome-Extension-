<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Reference Values</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --nav-bg: #3d5a73;
      --nav-hover: #4e6e87;
      --nav-active: #ffffff;
      --nav-active-text: #3d5a73;
      --accent: #3d5a73;
      --text-primary: #1a1a2e;
      --text-secondary: #555;
      --border: #e0e4e8;
      --row-alt: #f7f9fb;
      --header-row: #edf0f3;
      --white: #ffffff;
      --search-border: #c8d0d8;
      --shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    html, body {
      height: 100%;
      font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: var(--white);
      color: var(--text-primary);
    }

    /* ──────────── LAYOUT ──────────── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ──────────── TOP NAV ──────────── */
    .top-nav {
      background: var(--nav-bg);
      flex-shrink: 0;
    }

    .tabs-row {
      display: flex;
      align-items: stretch;
    }

    .tab-btn {
      flex: 1;
      padding: 11px 6px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.75);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, color 0.15s;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: var(--nav-hover);
      color: rgba(255,255,255,0.95);
    }

    .tab-btn.active {
      background: var(--white);
      color: var(--nav-active-text);
      font-weight: 600;
      border-bottom-color: transparent;
    }

    /* ──────────── SEARCH BAR ──────────── */
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-icon {
      color: #888;
      flex-shrink: 0;
      font-size: 14px;
    }

    .search-input {
      flex: 1;
      border: 1px solid var(--search-border);
      border-radius: 6px;
      padding: 6px 10px 6px 32px;
      font-family: inherit;
      font-size: 12.5px;
      color: var(--text-primary);
      background: #f5f7f9;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--white);
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-wrapper .search-icon-inner {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      pointer-events: none;
    }

    .clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: 15px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 4px;
      transition: background 0.1s;
      flex-shrink: 0;
    }

    .clear-btn:hover {
      background: #eee;
      color: #333;
    }

    .clear-btn.hidden { display: none; }

    /* ──────────── CONTENT AREA ──────────── */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    /* ──────────── SECTION TITLE ──────────── */
    .section-title {
      padding: 14px 14px 6px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    /* ──────────── TABLE ──────────── */
    .lab-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .lab-table colgroup col:nth-child(1) { width: 42%; }
    .lab-table colgroup col:nth-child(2) { width: 32%; }
    .lab-table colgroup col:nth-child(3) { width: 26%; }

    .lab-table thead th {
      padding: 8px 10px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      background: var(--white);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .lab-table tbody tr.data-row {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    .lab-table tbody tr.data-row:nth-child(even) {
      background: var(--row-alt);
    }

    .lab-table tbody tr.data-row:hover {
      background: #e8f0f7;
    }

    .lab-table tbody tr.header-row td {
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--header-row);
      border-bottom: 1px solid #d0d8e0;
      border-top: 1px solid #d0d8e0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .lab-table td {
      padding: 7px 10px;
      vertical-align: top;
      font-size: 12.5px;
      line-height: 1.4;
      word-break: break-word;
    }

    .lab-table td:first-child {
      color: var(--text-primary);
      font-weight: 400;
    }

    .lab-table td.indented {
      padding-left: 20px;
      color: #444;
    }

    .lab-table td:nth-child(2),
    .lab-table td:nth-child(3) {
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* ──────────── SEARCH RESULTS BADGE ──────────── */
    .search-badge {
      display: inline-block;
      font-size: 11px;
      color: #888;
      padding: 2px 0;
      margin-left: 4px;
    }

    /* ──────────── NO RESULTS ──────────── */
    .no-results {
      padding: 36px 20px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }

    .no-results span {
      font-size: 28px;
      display: block;
      margin-bottom: 8px;
    }

    /* ──────────── HIGHLIGHT ──────────── */
    mark {
      background: #fff3b0;
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* ──────────── SCROLLBAR ──────────── */
    .content-area::-webkit-scrollbar { width: 5px; }
    .content-area::-webkit-scrollbar-track { background: transparent; }
    .content-area::-webkit-scrollbar-thumb {
      background: #c0c8d0;
      border-radius: 4px;
    }

    /* ──────────── SEARCH ALL TABS LABEL ──────────── */
    .search-all-label {
      font-size: 11px;
      color: #888;
      padding: 6px 12px 2px;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- TOP TABS -->
  <nav class="top-nav">
    <div class="tabs-row">
      <button class="tab-btn active" data-tab="serum">Serum</button>
      <button class="tab-btn" data-tab="csf">Cerebrospinal</button>
      <button class="tab-btn" data-tab="blood">Blood</button>
      <button class="tab-btn" data-tab="urine">Urine &amp; BMI</button>
    </div>
  </nav>

  <!-- SEARCH BAR -->
  <div class="search-row">
    <div class="search-wrapper">
      <svg class="search-icon-inner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search all lab values…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <button class="clear-btn hidden" id="clearBtn" title="Clear search">✕</button>
  </div>

  <!-- TABLE CONTENT -->
  <div class="content-area" id="contentArea">
    <!-- injected by JS -->
  </div>

</div>

<script src="labdata.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
